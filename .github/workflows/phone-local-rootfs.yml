name: Build phone-local Linux dependencies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/phone-local-rootfs.yml]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare authenticated Ubuntu image and desktop dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-utils cloud-guest-utils ubuntu-cloudimage-keyring
          mkdir -p image/evidence image/mount
          cd image
          origin=https://cloud-images.ubuntu.com/noble/20261017
          curl --fail --location --retry 3 "$origin/SHA256SUMS" -o evidence/SHA256SUMS.ubuntu
          curl --fail --location --retry 3 "$origin/SHA256SUMS.gpg" -o evidence/SHA256SUMS.ubuntu.gpg
          gpgv --status-fd 1 --keyring /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg \
            evidence/SHA256SUMS.ubuntu.gpg evidence/SHA256SUMS.ubuntu > evidence/signature.log 2>&1
          curl --fail --location --retry 3 "$origin/noble-server-cloudimg-arm64.img" -o base.qcow2
          expected=50e24e1fb79e89116e939d90aa7738f7af48c442fa1bc2510131e0b39c50348e
          grep -Eq "^$expected [ *]noble-server-cloudimg-arm64.img$" evidence/SHA256SUMS.ubuntu
          printf '%s  base.qcow2\n' "$expected" | sha256sum --check
          qemu-img convert -f qcow2 -O raw base.qcow2 desktop.raw
          qemu-img resize -f raw desktop.raw 12G
          root=$(realpath mount)
          loop=$(sudo losetup --find --show --partscan desktop.raw)
          [[ "$loop" =~ ^/dev/loop[0-9]+$ ]]
          cleanup() {
            for part in dev/pts dev sys proc ''; do
              target="$root${part:+/$part}"
              if mountpoint -q "$target"; then sudo umount "$target"; fi
            done
            sudo losetup --detach "$loop"
          }
          trap cleanup EXIT
          sudo growpart "$loop" 1
          sudo resize2fs "${loop}p1"
          sudo mount "${loop}p1" "$root"
          sudo mount -t proc proc "$root/proc"
          sudo mount -t sysfs -o ro sysfs "$root/sys"
          sudo mount --bind /dev "$root/dev"
          sudo mount --bind /dev/pts "$root/dev/pts"
          sudo mv "$root/etc/resolv.conf" "$root/etc/resolv.conf.build-original"
          sudo cp /etc/resolv.conf "$root/etc/resolv.conf"
          printf '#!/bin/sh\nexit 101\n' | sudo tee "$root/usr/sbin/policy-rc.d" > /dev/null
          sudo chmod 755 "$root/usr/sbin/policy-rc.d"
          if test -f "$root/etc/apt/apt.conf.d/50command-not-found"; then
            sudo mv "$root/etc/apt/apt.conf.d/50command-not-found" "$root/etc/apt/apt.conf.d/50command-not-found.disabled"
          fi
          printf 'Acquire::Languages "none";\nAcquire::IndexTargets::deb::DEP-11::DefaultEnabled "false";\n' \
            | sudo tee "$root/etc/apt/apt.conf.d/99droiddeck-local" > /dev/null
          sudo chroot "$root" env DEBIAN_FRONTEND=noninteractive apt-get update
          # From the authenticated Chrome 157 ARM64 package control record.
          deps='ca-certificates, fonts-liberation, libasound2 (>= 1.0.17), libatk-bridge2.0-0 (>= 2.5.3), libatk1.0-0 (>= 2.11.90), libatspi2.0-0 (>= 2.9.90), libc6 (>= 2.25), libcairo2 (>= 1.14.0), libcups2 (>= 1.7.0), libcurl3-gnutls | libcurl3-nss | libcurl4 | libcurl3, libdbus-1-3 (>= 1.9.14), libexpat1 (>= 2.1~beta3), libgbm1 (>= 17.1.0~rc2), libglib2.0-0 (>= 2.49.3), libgtk-3-0 (>= 3.9.10) | libgtk-4-1, libnspr4 (>= 2:4.9-2~), libnss3 (>= 2:3.35), libpango-1.0-0 (>= 1.14.0), libudev1 (>= 183), libvulkan1, libx11-6 (>= 2:1.4.99.1), libxcb1 (>= 1.9.2), libxcomposite1 (>= 1:0.4.4-1), libxdamage1 (>= 1:1.1), libxext6, libxfixes3, libxkbcommon0 (>= 0.5.0), libxrandr2, wget, xdg-utils (>= 1.0.2)'
          printf '%s\n' "$deps" > evidence/chrome-157-dependencies.txt
          sudo chroot "$root" env DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends satisfy "$deps"
          sudo chroot "$root" env DEBIAN_FRONTEND=noninteractive apt-get -y --no-install-recommends install \
            tigervnc-standalone-server tigervnc-tools openbox xterm dbus-x11 fonts-dejavu-core x11-utils tini
          if sudo chroot "$root" dpkg-query -W google-chrome-stable; then
            echo 'Unexpected Chrome binary in dependency-only image' >&2
            exit 1
          fi
          sudo chroot "$root" dpkg-query -W -f='${binary:Package}\t${Version}\t${Architecture}\n' > evidence/packages.tsv
          sudo chroot "$root" dpkg --audit > evidence/dpkg-audit.txt
          test ! -s evidence/dpkg-audit.txt
          sudo chroot "$root" apt-get clean
          sudo rm "$root/etc/resolv.conf" "$root/usr/sbin/policy-rc.d"
          sudo mv "$root/etc/resolv.conf.build-original" "$root/etc/resolv.conf"
          sync
          cleanup
          trap - EXIT
          qemu-img convert -f raw -O qcow2 -c desktop.raw droiddeck-linux-deps-arm64.qcow2
          qemu-img check droiddeck-linux-deps-arm64.qcow2 | tee evidence/qcow2-check.txt
          qemu-img info --output=json droiddeck-linux-deps-arm64.qcow2 > evidence/image-info.json
          date -u +%FT%TZ > evidence/built-at.txt
          sha256sum droiddeck-linux-deps-arm64.qcow2 > evidence/image-sha256.txt
          printf 'Ubuntu 24.04 ARM64 desktop libraries only. Google Chrome is not included.\n' > evidence/SCOPE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phone-local-linux-dependencies-arm64
          path: |
            image/droiddeck-linux-deps-arm64.qcow2
            image/evidence/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

