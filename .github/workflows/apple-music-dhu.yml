name: Apple Music for the EX5 head unit
run-name: Apple Music DHU patch (${{ inputs.dpi }} dpi, ${{ inputs.profile }})
'on':
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct download URL of the original Apple Music .apk / .apkm / .xapk / .apks
        required: true
        type: string
      apk_sha256:
        description: Expected SHA-256 of that download (optional, recommended)
        required: false
        type: string
        default: ''
      dpi:
        description: UI density for the head unit, 120-640 (bigger = larger UI; 200/240/280/320/360 are common)
        type: string
        default: '280'
      keep_abis:
        description: Native library architectures to keep (EX5 head unit is arm64)
        type: string
        default: arm64-v8a
      media_bridge:
        description: Zeekr MediaCenter bridge (only useful on Zeekr units, not needed on Geely EX5)
        type: boolean
        default: false
      profile:
        description: >-
          Hook profile. full = upstream Apple Music preset (root, emulator, network, SIM bypass).
          lean = drop the root bypass (hooks every File.exists call) and rounded corners.
          minimal = display/UI only, no compatibility bypasses.
        type: choice
        options: [full, lean, minimal]
        default: full
      extra_options:
        description: >-
          Optional overrides, comma-separated key=true/false, e.g. "networkBypass=false,backButton=false".
          Keys: rootBypass emulatorBypass networkBypass simReady roundedCorners backButton forceOrientation fullscreen debug
        type: string
        default: ''
      allow_unknown_signer:
        description: Accept an input APK that is not signed by Apple (not recommended)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: apple-music-dhu-${{ github.ref }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ github.token }}
  # Patch bundle: https://github.com/mormislaw/zeekr-adapt-morphe-patches (GPLv3), pinned release.
  PATCHES_REPO: mormislaw/zeekr-adapt-morphe-patches
  PATCHES_TAG: v1.0.0
  MORPHE_REPO: MorpheApp/morphe-desktop
  APPLE_MUSIC_PACKAGE: com.apple.android.music
jobs:
  patch:
    name: Patch, strip and sign Apple Music
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Locate Android build tools
      run: |
        set -euo pipefail
        bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
        echo "BUILD_TOOLS=$bt" >> "$GITHUB_ENV"
        echo "Using $bt"

    - name: Download the original Apple Music package
      env:
        APK_URL: ${{ inputs.apk_url }}
        APK_SHA256: ${{ inputs.apk_sha256 }}
      run: |
        set -euo pipefail
        mkdir -p work/download
        url="$APK_URL"
        # Google Drive share links (…/file/d/<id>/view or ?id=<id>) -> direct download.
        drive_id=$(printf '%s' "$url" | sed -nE 's#^https://drive\.google\.com/(file/d/([A-Za-z0-9_-]+).*|.*[?&]id=([A-Za-z0-9_-]+).*)$#\2\3#p')
        if [ -n "$drive_id" ]; then
          url="https://drive.usercontent.google.com/download?id=${drive_id}&export=download&confirm=t"
          echo "Google Drive file id: $drive_id"
        fi
        curl -fL --retry 3 --proto '=https' -o work/download/input.bin "$url"
        if ! python3 -I -c 'import sys,zipfile; sys.exit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)' work/download/input.bin; then
          echo "::error::The download is not an APK/zip ($(file -b work/download/input.bin | cut -c1-80)). Share the file as 'Anyone with the link' and use a direct link."
          exit 1
        fi
        actual=$(sha256sum work/download/input.bin | cut -d' ' -f1)
        echo "Input SHA-256: $actual"
        echo "INPUT_SHA256=$actual" >> "$GITHUB_ENV"
        if [ -n "$APK_SHA256" ] && [ "${APK_SHA256,,}" != "$actual" ]; then
          echo "::error::SHA-256 mismatch: expected $APK_SHA256"
          exit 1
        fi

    - name: Identify the package and verify Apple's signature
      env:
        ALLOW_UNKNOWN_SIGNER: ${{ inputs.allow_unknown_signer }}
      run: |
        set -euo pipefail
        cd work
        # A single APK has AndroidManifest.xml at the root; a bundle holds several APKs.
        kind=$(python3 -I - download/input.bin <<'EOF'
        import sys, zipfile
        with zipfile.ZipFile(sys.argv[1]) as z:
            names = z.namelist()
        if "AndroidManifest.xml" in names:
            print("apk")
        elif any(n.endswith(".apk") for n in names):
            print("xapk" if "manifest.json" in names else "apks")
        else:
            sys.exit("Not an APK or split-APK bundle")
        EOF
        )
        echo "Input kind: $kind"
        mkdir -p apks
        if [ "$kind" = apk ]; then
          cp download/input.bin apks/base.apk
        else
          unzip -q -j download/input.bin '*.apk' -d apks
        fi
        cp download/input.bin "input.$kind"
        echo "INPUT_FILE=$PWD/input.$kind" >> "$GITHUB_ENV"

        found_package=false
        signers=""
        for apk in apks/*.apk; do
          pkg=$("$BUILD_TOOLS/aapt2" dump packagename "$apk")
          [ "$pkg" = "$APPLE_MUSIC_PACKAGE" ] && found_package=true
          if [ "$pkg" != "$APPLE_MUSIC_PACKAGE" ]; then
            echo "::error::$(basename "$apk") is $pkg, not $APPLE_MUSIC_PACKAGE"
            exit 1
          fi
          # Newer apksigner prints "Signer (minSdkVersion=…) certificate …" for v3.1 rotation,
          # older ones "Signer #1 certificate …"; match both.
          if ! certs=$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk" 2>&1); then
            echo "$certs"
            echo "::error::$(basename "$apk") has an invalid signature"
            exit 1
          fi
          dn=$(printf '%s\n' "$certs" | grep -m1 'certificate DN:' | sed 's/.*certificate DN: //' || true)
          sha=$(printf '%s\n' "$certs" | grep -m1 'certificate SHA-256 digest:' | sed 's/.*digest: //' || true)
          echo "$(basename "$apk"): $dn ($sha)"
          [ -n "$sha" ] || { printf '%s\n' "$certs"; echo "::error::No signer certificate found in $(basename "$apk")"; exit 1; }
          signers="$signers$sha"$'\n'
        done
        $found_package || { echo "::error::No $APPLE_MUSIC_PACKAGE APK in the input"; exit 1; }
        if [ "$(printf '%s' "$signers" | sort -u | grep -c .)" != 1 ]; then
          echo "::error::The split APKs are signed by different certificates"
          exit 1
        fi
        first=$(ls apks/*.apk | head -1)
        "$BUILD_TOOLS/apksigner" verify --print-certs "$first" | tee signer.txt
        if ! grep -qi 'certificate DN:.*apple' signer.txt; then
          if [ "$ALLOW_UNKNOWN_SIGNER" = true ]; then
            echo "::warning::The input is not signed by an Apple certificate"
          else
            echo "::error::The input is not signed by Apple. Use the original store APK (or set allow_unknown_signer)."
            exit 1
          fi
        fi
        version=$("$BUILD_TOOLS/aapt2" dump badging "$first" 2>/dev/null | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
        echo "APP_VERSION=${version:-unknown}" >> "$GITHUB_ENV"
        echo "Apple Music version: ${version:-unknown}"

    - name: Download Morphe and the zeekr-adapt patch bundle
      run: |
        set -euo pipefail
        mkdir -p tools
        gh release download "$PATCHES_TAG" --repo "$PATCHES_REPO" --pattern 'patches-*.mpp' --dir tools
        gh release download --repo "$MORPHE_REPO" --pattern 'morphe-desktop-*-all.jar' --dir tools
        ls -l tools
        (cd tools && sha256sum * | tee ../tools.sha256)
        echo "PATCHES_FILE=$(ls "$PWD"/tools/patches-*.mpp)" >> "$GITHUB_ENV"
        echo "MORPHE_JAR=$(ls "$PWD"/tools/morphe-desktop-*-all.jar)" >> "$GITHUB_ENV"

    - name: Apply the DHU adapter patch and strip unused native libraries
      env:
        DPI: ${{ inputs.dpi }}
        KEEP_ABIS: ${{ inputs.keep_abis }}
        MEDIA_BRIDGE: ${{ inputs.media_bridge }}
        PROFILE: ${{ inputs.profile }}
        EXTRA_OPTIONS: ${{ inputs.extra_options }}
      run: |
        set -euo pipefail
        # Hook categories: every enabled one adds Pine trampolines on framework methods.
        declare -A opt=([rootBypass]=true [emulatorBypass]=true [networkBypass]=true [simReady]=true
                        [roundedCorners]=true [backButton]=true [forceOrientation]=true
                        [fullscreen]=false [debug]=false)
        case "$PROFILE" in
          full) ;;
          lean) opt[rootBypass]=false; opt[roundedCorners]=false ;;
          minimal) opt[rootBypass]=false; opt[emulatorBypass]=false; opt[networkBypass]=false
                   opt[simReady]=false; opt[roundedCorners]=false ;;
          *) echo "::error::Unknown profile $PROFILE"; exit 1 ;;
        esac
        if [ -n "$EXTRA_OPTIONS" ]; then
          IFS=',' read -ra pairs <<< "$EXTRA_OPTIONS"
          for pair in "${pairs[@]}"; do
            pair=$(echo "$pair" | xargs)
            key=${pair%%=*}; val=${pair#*=}
            if [ -z "${opt[$key]+x}" ] || { [ "$val" != true ] && [ "$val" != false ]; }; then
              echo "::error::Invalid extra option '$pair' (use key=true or key=false with a listed key)"
              exit 1
            fi
            opt[$key]=$val
          done
        fi
        opt_args=()
        for key in "${!opt[@]}"; do opt_args+=("-O$key=${opt[$key]}"); done
        echo "Hook options: $(printf '%s ' "${opt_args[@]}" | tr ' ' '\n' | sort | tr '\n' ' ')"
        printf '%s\n' "${opt_args[@]}" | sort > out-options.txt
        if ! [[ "$DPI" =~ ^[0-9]+$ ]] || [ "$DPI" -lt 120 ] || [ "$DPI" -gt 640 ]; then
          echo "::error::dpi must be a number from 120 to 640"
          exit 1
        fi
        mkdir -p out
        java -jar "$MORPHE_JAR" patch \
          -p "$PATCHES_FILE" \
          --exclusive -e "DHU adapter" \
          -OmetricsDpi="$DPI" -OconfigDpi="$DPI" \
          -OmediaBridge="$MEDIA_BRIDGE" \
          "${opt_args[@]}" \
          --striplibs "$KEEP_ABIS" \
          --unsigned \
          -t work/tmp \
          -r out/patch-result.json \
          -o work/patched-unsigned.apk \
          "$INPUT_FILE"

        # The patch also ships Pine for armeabi-v7a as an asset; drop the ABIs we do not keep.
        IFS=',' read -ra keep <<< "$KEEP_ABIS"
        for abi in arm64-v8a armeabi-v7a; do
          keep_it=false
          for k in "${keep[@]}"; do [ "$(echo "$k" | xargs)" = "$abi" ] && keep_it=true; done
          if ! $keep_it; then
            zip -q -d work/patched-unsigned.apk "assets/dhu-adapter/lib/$abi/*" || true
          fi
        done
        echo "Native libraries left in the APK:"
        unzip -l work/patched-unsigned.apk | awk '{print $4}' | grep -E '^(lib/|assets/dhu-adapter/lib/).*\.so$' | xargs -r -n1 dirname | sort | uniq -c

    - name: Align and sign
      env:
        KEYSTORE_B64: ${{ secrets.APPLE_MUSIC_DHU_KEYSTORE_B64 }}
        KEYSTORE_PASSWORD: ${{ secrets.APPLE_MUSIC_DHU_KEYSTORE_PASSWORD }}
        DPI: ${{ inputs.dpi }}
        KEEP_ABIS: ${{ inputs.keep_abis }}
        MEDIA_BRIDGE: ${{ inputs.media_bridge }}
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        if [ -n "${KEYSTORE_B64:-}" ]; then
          echo "$KEYSTORE_B64" | base64 -d > work/sign.p12
          pass="$KEYSTORE_PASSWORD"
          signing="repository secret (stable key, updates install over each other)"
        else
          pass=$(openssl rand -hex 16)
          keytool -genkeypair -keystore work/sign.p12 -storetype PKCS12 -storepass "$pass" \
            -alias dhu -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=DHU Adapter" >/dev/null
          echo "::warning::No APPLE_MUSIC_DHU_KEYSTORE_B64 secret: signed with a one-off key, uninstall before installing the next build."
          signing="one-off key (uninstall before the next build)"
        fi
        "$BUILD_TOOLS/zipalign" -f -P 16 4 work/patched-unsigned.apk work/aligned.apk
        name="AppleMusic-${APP_VERSION}-DHU-${PROFILE}.apk"
        "$BUILD_TOOLS/apksigner" sign --ks work/sign.p12 --ks-pass "pass:$pass" --out "out/$name" work/aligned.apk
        "$BUILD_TOOLS/apksigner" verify --print-certs "out/$name" > out/signature.txt
        test "$("$BUILD_TOOLS/aapt2" dump packagename "out/$name")" = "$APPLE_MUSIC_PACKAGE"
        (cd out && sha256sum "$name" > "$name.sha256")
        cp tools.sha256 out/tools.sha256
        mv out-options.txt out/hook-options.txt
        in_size=$(stat -c %s "$INPUT_FILE"); out_size=$(stat -c %s "out/$name")
        {
          echo "### Apple Music $APP_VERSION for the head unit"
          echo
          echo "- Input SHA-256: \`$INPUT_SHA256\` ($in_size bytes)"
          echo "- Output: \`$name\`, $out_size bytes"
          echo "- Output SHA-256: \`$(cut -d' ' -f1 "out/$name.sha256")\`"
          echo "- Patch: zeekr-adapt \`$PATCHES_TAG\` DHU adapter, $DPI dpi, media bridge $MEDIA_BRIDGE"
          echo "- Kept native ABIs: $KEEP_ABIS"
          echo "- Hook profile: $PROFILE ($(tr '\n' ' ' < out/hook-options.txt))"
          echo "- Signing: $signing"
          echo
          echo "For personal use on your own head unit. Do not redistribute the patched app."
        } >> "$GITHUB_STEP_SUMMARY"
        rm -f work/sign.p12

    - uses: actions/upload-artifact@v4
      with:
        name: apple-music-dhu-apk
        path: out/
        retention-days: 7
