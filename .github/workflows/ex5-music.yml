name: EX5 Music APK
'on':
  push:
    paths:
    - .github/workflows/ex5-music.yml
    - ex5-music/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ex5-music-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Build and test the EX5 Music APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'
    - name: Unit tests
      working-directory: ex5-music
      run: gradle --no-daemon testDebugUnitTest
    - name: Build the installable APK
      working-directory: ex5-music
      run: gradle --no-daemon assembleDebug
    - name: Verify the APK and record its checksum
      run: |
        set -euo pipefail
        apk=ex5-music/app/build/outputs/apk/debug/app-debug.apk
        test -s "$apk"
        mkdir -p out
        cp "$apk" out/EX5Music.apk
        apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
        "$apksigner" verify --print-certs out/EX5Music.apk | tee out/signature.txt
        (cd out && sha256sum EX5Music.apk | tee EX5Music.apk.sha256)
        {
          echo "### EX5 Music APK"
          echo
          echo "- Size: $(stat -c %s out/EX5Music.apk) bytes"
          echo "- SHA-256: \`$(cut -d' ' -f1 out/EX5Music.apk.sha256)\`"
          echo "- Signed with this run's debug key (sideload use)."
        } >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@v4
      with:
        name: ex5-music-apk
        path: out/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ex5-music-test-results
        path: ex5-music/app/build/reports/tests/
        retention-days: 14
